services:
  bot:
    build: .
    restart: unless-stopped
    env_file: [.env]
    environment:
      MONGO_URI: mongodb://mongo:27017
      DB_NAME: security_bot
      MODE: polling
      PORT: 8080
    depends_on:
      mongo:
        condition: service_healthy
    ports: ["8080:8080"]
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mongo_data:
