services:
  - type: web
    name: telegram-security-bot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: security_bot
      - key: MODE
        value: webhook
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: INFO
      - key: DROP_PENDING_UPDATES
        value: "false"
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_SECRET
        sync: false
